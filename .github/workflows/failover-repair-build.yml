name: Failover Repair Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: 1.91.1

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: failover-repair-linux-x64

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run focused tests
        working-directory: src-tauri
        run: |
          cargo test circuit_breaker
          cargo test daemon::ipc::protocol

      - name: Build release binary
        working-directory: src-tauri
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/cc-switch dist/cc-switch
          sha256sum dist/cc-switch > dist/cc-switch.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-failover-repair-linux-x64
          path: dist/
          if-no-files-found: error
